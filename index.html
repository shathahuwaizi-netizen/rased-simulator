<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>رصد · من الحادث إلى الحساسات</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <canvas id="cv" aria-label="مشهد ثلاثي الأبعاد لمشروع رصد"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>
  <div class="cut" id="cut" aria-hidden="true"></div>
  <div class="lost" id="lost" hidden><p>كرت الشاشة توقف لحظياً، جارٍ إعادة تشغيل المشهد بجودة أخف…</p><button class="btn btn--primary" type="button" onclick="location.reload()">إعادة التشغيل الآن</button></div>

  <div class="loader" id="loader" role="status">
    <svg class="loader__mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4c-8.3 0-15 6.5-15 14.6C9 30 24 44 24 44s15-14 15-25.4C39 10.5 32.3 4 24 4z" fill="none" stroke="#2fd4ff" stroke-width="2.4"/><path d="M19 26V13h6.2a4.3 4.3 0 0 1 0 8.6H19m6 0 5 4.4" fill="none" stroke="#2fd4ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <p class="loader__title">رصد · <span dir="ltr">Rased AI</span></p>
    <div class="loader__bar"><span id="loadfill"></span></div>
    <p class="loader__step" id="loadstep">تجهيز المشهد</p>
    <button class="btn btn--primary loader__go" id="go" type="button" hidden>ابدأ العرض</button>
  </div>

  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true"><path d="M24 4c-8.3 0-15 6.5-15 14.6C9 30 24 44 24 44s15-14 15-25.4C39 10.5 32.3 4 24 4z" fill="none" stroke="#2fd4ff" stroke-width="2.6"/><path d="M19 26V13h6.2a4.3 4.3 0 0 1 0 8.6H19m6 0 5 4.4" fill="none" stroke="#2fd4ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span><b>رصد <i dir="ltr">RASED</i></b><small>من لحظة الحادث إلى داخل الجهاز · حساس حساس</small></span>
    </div>
    <div class="badges"><span class="badge" id="badge-sim" hidden>القراءات الحية محاكاة توضيحية · قيم «من الاختبار الفعلي» من سجل النموذج</span></div>
    <div class="actions">
      <button class="btn btn--primary" id="btn-play" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path class="i-play" d="M7 5v14l12-7z"/><path class="i-pause" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg><span>تشغيل كفيلم</span></button>
      <button class="btn" id="btn-voice" type="button" aria-pressed="false" title="تعليق صوتي بالعربي (V)">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" /><path class="i-wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>التعليق الصوتي</span></button>
      <button class="btn btn--icon" id="btn-full" type="button" title="ملء الشاشة (F)"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
  </header>

  <aside class="panel glass" id="panel" aria-live="polite"><div class="panel__inner" id="panel-inner"></div></aside>

  <div class="mark" id="mark" aria-hidden="true"><span class="mark__num" id="mark-num"></span><span class="mark__name" id="mark-name"></span></div>

  <nav class="rail" id="rail" aria-label="الشرائح"></nav>

  <footer class="bar">
    <div class="sub glass" id="subwrap"><p class="sub__text" id="sub"></p></div>
    <div class="ctrl">
      <button class="btn btn--icon" id="next" type="button" title="التالي (← أو مسافة)"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="ctrl__count" id="count"></span>
      <button class="btn btn--icon" id="prev" type="button" title="السابق (→)"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="prog" id="prog"></div>
  </footer>

  <noscript><p class="noscript">هذا العرض يحتاج تفعيل JavaScript و WebGL.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
